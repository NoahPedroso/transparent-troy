<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">

	<link rel="icon" href="/favicon.ico" type="image/x-icon" />
	<meta
		property="og:image"
		content="https://transparenttroy.com/TT.png" />
	<meta
		property="og:description"
		content="Find your city council member" />
	<meta property="og:title" content="Transparent Troy" />
	<title>Transparent Troy</title>

	<link rel="stylesheet" href="reset.css">
	<link rel="stylesheet" href="styles.css">

	<!-- External Depdendencies -->
	<!-- Leaflet - Interactive Maps -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
		integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
		crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
		integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
		crossorigin=""></script>
	<!-- Turf - geojson manipulation -->
	<script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script>

</head>
<body>
	<nav>
		<a href="./">Home</a>
		<a href="about.html">About</a>
	</nav>
	<main>
		<h1>Transparent Troy</h1>
		<h2>Find your city council member</h2>
		<div class="actions">
			<button id="geolocation" type="button">Use Current Location</button>
			<span>or</span>
			<form id="geocoding" class="single-input-form">
				<input
					id="address-search"
					name="address-search"
					type="text"
					list="addresses"
					autocomplete="street-address"
					placeholder="Enter your address...">
				<button type="submit">Find Location</button>
				<datalist id="addresses"></datalist>
			</form>
		</div>
		<div class="info-container">
			<div hidden class="district-info">
				<section>
					<h3>
						<span>You are in:</span>
						<span>District <span class="district-number"></span></span>
					</h3>
					<img src="" alt="" class="portrait">
					<dl>
						<dt>Councilmember</dt>
						<dd class="councilmember"></dd>
						<dt>Phone number</dt>
						<dd class="phone-number"><a href="tel:"></a></dd>
						<dt>Email</dt>
						<dd class="email"><a href="mailto:"></a></dd>
						<dt>Address</dt>
						<dd class="address"></dd>
					</dl>
				</section>
				<p hidden>You appear to be outside Troy. Come back soon!</p>
			</div>
			<!-- The Map -->
			<div>
				<div id="map"></div>
				<button id="return" type="button">Return to Troy</button>
			</div>
		</div>
	</main>

	<!-- Using type module allows us to use top-level await. Unsure what other reason to use it.
	 Using defer to allow full page to render. Also need to learn more about that. -->
	<script type="module" src="main.js" defer></script>

	<footer id="contact">
        <p>Contact Me</p>
        <a href="https://www.instagram.com/morelikenoahsarc">Instagram</a>
		<a href="mailto:noah@transparenttroy.com">Email</a>
    </footer>
</body>
</html>
